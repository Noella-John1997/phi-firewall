[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-firewall"
version = "0.1.0"
description = "A privacy proxy that strips PHI/PII from LLM requests and restores it in responses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noella John" }]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "cryptography>=42", "pydantic>=2.5", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
aws = ["boto3>=1.34"]
presidio = ["presidio-analyzer>=2.2"]

[project.scripts]
phi-firewall = "phi_firewall.cli:main"

[tool.setuptools.packages.find]
include = ["phi_firewall*"]

[tool.setuptools.package-data]
phi_firewall = ["policy/*.yaml"]
